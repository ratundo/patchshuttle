[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "patchshuttle"
dynamic = ["version"]
description = "Local, auditable patch workflows for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "patch", "automation", "cli", "development-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "black>=24,<27",
    "click>=8.1,<9",
    "filelock>=3.30,<4",
    "isort>=5.13,<7",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
html = [
    "djlint>=1.44,<2",
]
dev = [
    "build>=1.2,<2",
    "django>=5.2,<7",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "twine>=6.1,<7",
]

[project.scripts]
patchshuttle = "patchshuttle.cli:main"

[tool.hatch.version]
path = "src/patchshuttle/_version.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/.github",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SPEC_V0_1.md",
    "/docs",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/tools",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/patchshuttle"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
py_version = 310
src_paths = ["src", "tests", "tools"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["patchshuttle"]

[tool.coverage.report]
show_missing = true
skip_covered = true
