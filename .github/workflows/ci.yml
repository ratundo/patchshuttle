name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: windows-2025
            python-version: "3.12"
          - os: windows-2025
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check import ordering
        run: python -m isort --check-only src tests tools
      - name: Check formatting
        run: python -m black --check src tests tools
      - name: Run tests with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=100

  package:
    name: Build and smoke-test distributions
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tools/release_checks.py dist
      - name: Smoke-test wheel
        run: >-
          python tools/wheel_smoke.py dist/*.whl
          --version "$(python -c 'from pathlib import Path; from tools.check_tag import source_version; print(source_version(Path.cwd()))')"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: patchshuttle-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
